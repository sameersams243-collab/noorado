<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- browser window -->
  <rect x="120" y="70" width="560" height="34" rx="10" fill="#e9edf5"/>
  <rect x="120" y="94" width="560" height="10" fill="#e9edf5"/>
  <circle cx="140" cy="87" r="5" fill="#f28b82"/>
  <circle cx="158" cy="87" r="5" fill="#fbd063"/>
  <circle cx="176" cy="87" r="5" fill="#8bd18f"/>

  <!-- nav bar -->
  <rect x="140" y="118" width="60" height="12" rx="2" fill="#1f2937"/>
  <rect x="480" y="120" width="40" height="8" rx="2" fill="#9ca3af"/>
  <rect x="530" y="120" width="40" height="8" rx="2" fill="#9ca3af"/>
  <rect x="580" y="120" width="40" height="8" rx="2" fill="#9ca3af"/>
  <rect x="630" y="112" width="30" height="20" rx="4" fill="#2563eb"/>

  <!-- hero text -->
  <text x="140" y="174" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Grow your business</text>
  <text x="140" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">with a modern site</text>
  <text x="140" y="221" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Responsive design built to convert</text>
  <text x="140" y="237" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">visitors into customers.</text>
  <rect x="140" y="252" width="90" height="26" rx="6" fill="#7c3aed"/>
  <text x="185" y="269" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Get started</text>

  <!-- hero graphic block -->
  <rect x="440" y="150" width="200" height="130" rx="8" fill="#eef2ff"/>
  <rect x="460" y="170" width="90" height="10" rx="2" fill="#93c5fd"/>
  <rect x="460" y="190" width="140" height="10" rx="2" fill="#c4b5fd"/>
  <rect x="460" y="210" width="110" height="10" rx="2" fill="#93c5fd"/>
  <circle cx="600" cy="250" r="18" fill="#7c3aed" opacity="0.7"/>
  <g stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="600" cy="250" r="10"/>
    <ellipse cx="600" cy="250" rx="4" ry="10"/>
    <line x1="590" y1="250" x2="610" y2="250"/>
  </g>

  <!-- footer cards -->
  <rect x="140" y="310" width="150" height="60" rx="6" fill="#f3f4f6"/>
  <rect x="315" y="310" width="150" height="60" rx="6" fill="#f3f4f6"/>
  <rect x="490" y="310" width="150" height="60" rx="6" fill="#f3f4f6"/>

  <!-- shield icon (card 1: security) -->
  <g stroke="#2563eb" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M165 322 L180 317 L195 322 L195 336 C195 346 187 353 180 356 C173 353 165 346 165 336 Z"/>
    <path d="M172 333 L178 339 L189 326" stroke-linecap="round"/>
  </g>

  <!-- lightning icon (card 2: speed) -->
  <g stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M383 320 L365 337.6 L378 337.6 L373 352 L393 332.8 L380 332.8 Z"/>
  </g>

  <!-- device/responsive icon (card 3) -->
  <g stroke="#2563eb" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="540" y="318" width="46" height="30" rx="3"/>
    <line x1="540" y1="342" x2="586" y2="342"/>
    <rect x="592" y="330" width="18" height="26" rx="2"/>
  </g>

  <!-- card labels -->
  <text x="215" y="364" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Secure</text>
  <text x="390" y="364" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Fast</text>
  <text x="565" y="364" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Responsive</text>
</svg>
